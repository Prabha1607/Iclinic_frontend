server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── AUTH SERVICE exceptions inside /api/v1/users/ ────────────────────────
    # These specific sub-paths live in auth-service and must be matched BEFORE
    # the generic /api/v1/users/ block below (nginx picks the longest prefix first,
    # but regex locations are evaluated before prefix ones of the same length).

    # provider slots → main-service  (exception: lives in main-service)
    location ~ ^/api/v1/users/providers/[0-9]+/slots {
        proxy_pass http://main-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # providers/by-type → auth-service  (frontend calls this directly)
    location ~ ^/api/v1/users/providers/by-type {
        proxy_pass http://auth-service:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # ── AUTH SERVICE → auth-service:8001 ─────────────────────────────────────
    location /api/v1/auth/ {
        proxy_pass http://auth-service:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    location /api/v1/users/ {
        proxy_pass http://auth-service:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # ── MAIN SERVICE → main-service:8000 ─────────────────────────────────────
    location /api/ {
        proxy_pass http://main-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket → main-service:8000 ────────────────────────────────────────
    location /ws/ {
        proxy_pass http://main-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host       $host;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}